name: Video Agent Real Media HyperFrames

on:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'scripts/run_real_media_acceptance.py'
      - 'examples/real-media/**'
      - '.github/workflows/real-media-hyperframes.yml'
  workflow_dispatch:

jobs:
  hyperframes-real-media:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: creator-os-video-agent
      - name: Clone public sibling engines
        run: |
          git clone --depth 1 https://github.com/jaminliu89/ai-director-engine.git ai-director-engine
          git clone --depth 1 https://github.com/jaminliu89/motion-runtime-os.git motion-runtime-os
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r ai-director-engine/requirements.txt jsonschema
      - name: Install Motion Runtime dependencies
        run: npm install
        working-directory: motion-runtime-os
      - name: Stage pinned public-domain source media
        run: |
          mkdir -p creator-os-video-agent/work/real-media-hyperframes/input
          curl -L --fail --retry 3 'https://d34w7g4gy10iej.cloudfront.net/video/2603/DOD_111581929/DOD_111581929.mp4' -o creator-os-video-agent/work/real-media-hyperframes/input/source.mp4
          echo 'a93869b5712154b990909a3bfb14e2636a5cce59174ecd64854abdbda302fad0  creator-os-video-agent/work/real-media-hyperframes/input/source.mp4' | sha256sum -c -
      - name: Execute HyperFrames-first orchestrated pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}/creator-os-video-agent
          AI_DIRECTOR_REPO: ${{ github.workspace }}/ai-director-engine
          MOTION_RUNTIME_REPO: ${{ github.workspace }}/motion-runtime-os
        working-directory: creator-os-video-agent
        run: python scripts/run_real_media_acceptance.py --project-root work/real-media-hyperframes --motion-provider motion-runtime-hyperframes
      - name: Verify provider selection and final media
        run: |
          test -s creator-os-video-agent/work/real-media-hyperframes/output/final.mp4
          test -s creator-os-video-agent/work/real-media-hyperframes/evidence/hyperframes-render-result.json
          python -c "import json; s=json.load(open('creator-os-video-agent/work/real-media-hyperframes/state/run-state.json')); a=s['jobs']['motion-001']['attempts']; assert a[-1]['provider']=='motion-runtime-hyperframes' and a[-1]['status']=='succeeded', a; print('HyperFrames provider PASS')"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1 creator-os-video-agent/work/real-media-hyperframes/output/final.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1 creator-os-video-agent/work/real-media-hyperframes/output/final.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: creator-os-video-agent-real-media-hyperframes
          path: |
            creator-os-video-agent/work/real-media-hyperframes/output/final.mp4
            creator-os-video-agent/work/real-media-hyperframes/state/*.json
            creator-os-video-agent/work/real-media-hyperframes/evidence/*.json
          if-no-files-found: error
